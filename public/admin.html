<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Falibank · Histórico</title><link rel="icon" href="/icon.svg?v=7" type="image/svg+xml"><link rel="stylesheet" href="/style.css?v=7"><link rel="stylesheet" href="/admin.css?v=5"><script type="module" src="/admin.js?v=7.3"></script></head><body><main class="shell adminshell"><header><a href="/" class="soft back">‹ Voltar ao jogo</a><strong class="adminbrand">fali<b>bank</b> <small>Admin</small></strong></header><h1>Histórico de partidas</h1><p class="subtitle">Balanço financeiro, vencedores e movimentações.</p><section id="login" class="panel"><form id="loginForm"><label>Código secreto<input id="secret" type="password" maxlength="256" required autocomplete="off" placeholder="Código administrativo"></label><button class="primary">Acessar</button></form></section><p id="message" role="status"></p><section id="dashboard" class="hidden"><div class="adminbar"><button id="refresh" class="soft">Atualizar</button><button id="logout" class="soft">Sair do painel</button></div><form id="lookup" class="panel"><label>Localizar partida pelo código<input id="room" placeholder="BR001 ou código antigo" maxlength="14" required autocapitalize="characters"></label><button class="primary">Consultar</button></form><section class="panel" style="margin-top:16px"><h2>Trilha do campeão</h2><p id="audioStatus" role="status">Consultando configuração…</p><form id="audioForm"><label>Trecho de áudio autorizado (MP3, até 1 MiB)<input id="audioFile" type="file" accept=".mp3,audio/mpeg" required></label><label><input id="audioRights" type="checkbox" required style="width:auto;min-height:0;margin:0 6px 0 0">Tenho autorização para compartilhar este áudio com os jogadores.</label><button class="primary">Salvar trilha</button></form><button id="removeAudio" class="link danger">Remover trilha</button><p><small>Sem arquivo, toca a fanfarra original do Falibank.</small></p></section><section class="panel" style="margin-top:16px"><h2>Hall da Fama &amp; da Vergonha</h2><p>Apelidos iguais são agrupados; identidade não verificada.</p><button id="loadHall" class="soft">Consultar ranking histórico</button><p id="hallStatus" role="status"></p><div id="hallResults"></div></section><div id="rooms"></div><button class="soft hidden" id="more">Carregar mais</button><section id="detail" class="hidden panel"></section></section></main></body></html>
